<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>執筆室 - 美由紀エディタ</title>
  <script src="https://unpkg.com/docx@8.2.2/build/index.umd.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: #e8e3d9;
      color: #333;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
    }

    header {
      background-color: #e8e3d9;
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid #d4cebe;
    }

    .app-title {
      font-weight: bold;
      font-size: 1.1rem;
      color: #4a3e3d;
    }

    input[type="text"].title-input {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 6px 8px;
      border: 1px solid #c5bea8;
      border-radius: 4px;
      background: #faf8f5;
      color: #333;
      flex: 1;
      min-width: 120px;
    }

    select, button {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 6px 10px;
      border: 1px solid #b3a890;
      border-radius: 4px;
      background-color: #faf8f5;
      color: #4a3e3d;
      cursor: pointer;
    }

    button.primary {
      background-color: #8c6d58;
      color: #fff;
      border-color: #735745;
    }

    main {
      padding: 10px;
    }

    .editor-container {
      width: 100%;
      height: 65vh;
      min-height: 400px;
      background-color: #fdfbf7;
      border: 1px solid #d4cebe;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 12px;
      overflow: auto;
    }

    textarea {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
      font-size: 1.05rem;
      line-height: 1.8;
      color: #2b2b2b;
      resize: none;
      white-space: pre-wrap;
      word-wrap: break-word;
      -webkit-appearance: none;
    }

    textarea.vertical {
      writing-mode: vertical-rl;
      -webkit-writing-mode: vertical-rl;
      overflow-x: auto;
      overflow-y: hidden;
    }

    footer {
      background-color: #dfd8c8;
      border-top: 1px solid #c8c0ae;
      padding: 12px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #5c5048;
    }

    .char-count {
      font-weight: bold;
      color: #4a3e3d;
    }

    .cheer-msg {
      font-style: italic;
      color: #7a685a;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <span class="app-title">執筆室</span>
    <input type="text" id="docTitle" class="title-input" placeholder="無題の原稿" value="無題の原稿">
    
    <select id="writingMode">
      <option value="vertical" selected>モード: 縦書き</option>
      <option value="horizontal">モード: 横書き</option>
    </select>

    <button id="btnTxt">.txt保存</button>
    <button id="btnDocx" class="primary">.docx保存</button>
  </header>

  <main>
    <div class="editor-container">
      <textarea id="editor" class="vertical" placeholder="ここに文章を入力してください..."></textarea>
    </div>
  </main>

  <footer>
    <div>
      <span class="char-count">文字数: <strong id="charCount">0</strong> 字</span>
    </div>
    <div id="cheerMsg" class="cheer-msg">見守り中...</div>
  </footer>

  <script>
    const editor = document.getElementById('editor');
    const docTitle = document.getElementById('docTitle');
    const writingMode = document.getElementById('writingMode');
    const charCount = document.getElementById('charCount');
    const cheerMsg = document.getElementById('cheerMsg');
    const btnTxt = document.getElementById('btnTxt');
    const btnDocx = document.getElementById('btnDocx');

    const cheers = [
      "執筆、お疲れ様です✨",
      "素敵な表現ですね！",
      "物語が紡がれています...",
      "その調子です！ファイト！",
      "集中していて素晴らしいです",
      "あなたのペースで進めましょう"
    ];

    const STORAGE_KEY_TEXT = 'miyuki_editor_content';
    const STORAGE_KEY_TITLE = 'miyuki_editor_title';

    let isComposing = false; // 日本語入力中（未確定状態）フラグ
    let saveTimeout = null;

    // 初期データ読み込み
    window.addEventListener('DOMContentLoaded', () => {
      const savedText = localStorage.getItem(STORAGE_KEY_TEXT);
      const savedTitle = localStorage.getItem(STORAGE_KEY_TITLE);
      
      if (savedText) editor.value = savedText;
      if (savedTitle) docTitle.value = savedTitle;

      updateStatus();
    });

    // 日本語入力の確定状態を監視（誤作動防止）
    editor.addEventListener('compositionstart', () => {
      isComposing = true;
    });

    editor.addEventListener('compositionend', () => {
      isComposing = false;
      saveWithDebounce();
      updateStatus();
    });

    // 入力・削除イベント
    editor.addEventListener('input', () => {
      updateStatus();
      if (!isComposing) {
        saveWithDebounce();
      }
    });

    // タイトル保存
    docTitle.addEventListener('input', () => {
      localStorage.setItem(STORAGE_KEY_TITLE, docTitle.value);
    });

    // 遅延保存処理（消去連打時の復元バグを防ぐ）
    function saveWithDebounce() {
      if (saveTimeout) clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        localStorage.setItem(STORAGE_KEY_TEXT, editor.value);
      }, 300);
    }

    // 縦書き/横書き切り替え
    writingMode.addEventListener('change', (e) => {
      if (e.target.value === 'vertical') {
        editor.classList.add('vertical');
      } else {
        editor.classList.remove('vertical');
      }
    });

    // ステータス更新
    function updateStatus() {
      const count = editor.value.length;
      charCount.textContent = count.toLocaleString();

      if (count > 0) {
        const index = Math.floor(count / 200) % cheers.length;
        cheerMsg.textContent = cheers[index];
      } else {
        cheerMsg.textContent = "静かな執筆室です...";
      }
    }

    // .txt保存
    btnTxt.addEventListener('click', () => {
      const title = docTitle.value.trim() || '無題の原稿';
      const blob = new Blob([editor.value], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${title}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    });

    // .docx保存
    btnDocx.addEventListener('click', async () => {
      const title = docTitle.value.trim() || '無題の原稿';
      const text = editor.value;

      if (!window.docx) {
        alert('docxライブラリの読み込みに失敗しました。');
        return;
      }

      const { Document, Packer, Paragraph, TextRun } = window.docx;

      const paragraphs = text.split('\n').map(line => {
        return new Paragraph({
          children: [
            new TextRun({
              text: line,
              font: "Hiragino Mincho ProN",
              size: 21,
            }),
          ],
        });
      });

      const doc = new Document({
        sections: [{
          properties: {},
          children: paragraphs,
        }],
      });

      const blob = await Packer.toBlob(doc);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${title}.docx`;
      a.click();
      URL.revokeObjectURL(a.href);
    });
  </script>
</body>
</html>
